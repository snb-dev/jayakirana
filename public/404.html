<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jayakirana Pvt. Ltd.</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a refresh on /shop).
      It re-encodes the path into a query string and redirects to index.html, which
      decodes it back before React Router mounts. See index.html for the other half.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1; // number of path segments in the base, i.e. "/jayakirana/"
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
